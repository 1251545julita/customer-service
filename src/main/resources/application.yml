spring:
  application:
    name: customer-service

  datasource:
    url: "jdbc:mysql://localhost:3306/customer_service?createDatabaseIfNotExist=true"
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "admin"

  jpa:
    hibernate:
      ddl-auto: update #create-drop - con update va a estar actualizando todo el tiempo.
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      indent-output: true

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
